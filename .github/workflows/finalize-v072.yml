# Trigger the one-time v0.7.2 release-branch finalizer.
name: Finalize v0.7.2 branch

on:
  push:
    branches: [release/v0.7.2]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: release/v0.7.2
          fetch-depth: 0

      - name: Apply exact v0.7.2 candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v071-v072.patch.xz.b64" <<'B64'

B64
          base64 -d "$RUNNER_TEMP/v071-v072.patch.xz.b64" > "$RUNNER_TEMP/v071-v072.patch.xz"
          echo "ac83e215668d229a7feb62085cc8882dd03ca79c7e582309f526efdf77b683e8  $RUNNER_TEMP/v071-v072.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/v071-v072.patch.xz" > "$RUNNER_TEMP/v071-v072.patch"
          echo "9baa02f117d72417b0ab92f07ed90cb90c92cd6985c6d7e68bfbb08218b0a278  $RUNNER_TEMP/v071-v072.patch" | sha256sum -c -
          patch -p1 < "$RUNNER_TEMP/v071-v072.patch"

      - name: Rebuild final release manifest
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-v072.yml
          python <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          manifest_path = root / '_bonumark_stream/RELEASE-MANIFEST.json'
          files = []
          for file in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x: x.relative_to(root).as_posix()):
              rel = file.relative_to(root).as_posix()
              if rel == '_bonumark_stream/RELEASE-MANIFEST.json' or rel.startswith('.git/'):
                  continue
              files.append({'path': rel, 'sha256': hashlib.sha256(file.read_bytes()).hexdigest()})
          manifest = {
              'name': 'bonumark-stream',
              'version': '0.7.2',
              'generated_at': '2026-08-26T18:09:33Z',
              'files': files,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY
          echo "dd7dc6d8262bddd8c4ae2c02c1492c6a061af9d6b1a6a395b9290f426e1d8514  _bonumark_stream/RELEASE-MANIFEST.json" | sha256sum -c -

      - name: Verify exact v0.7.2 release tree
        shell: bash
        run: |
          set -euo pipefail
          release_tree="$RUNNER_TEMP/bonumark-v072"
          rm -rf "$release_tree"
          mkdir -p "$release_tree"
          rsync -a --exclude='.git/' ./ "$release_tree/"
          (
            cd "$release_tree"
            test "$(cat VERSION)" = "0.7.2"
            test "$(cat _bonumark_stream/VERSION)" = "0.7.2"
            test -f api/v1/stream/posts.php
            test -f scripts/fixtures/v0.4.x-initial-schema.php
            while IFS= read -r -d '' file; do
              php -l "$file" >/dev/null
            done < <(find . -type f -name '*.php' -print0)
            php scripts/smoke-test.php
            python <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('.')
          manifest = json.loads((root / '_bonumark_stream/RELEASE-MANIFEST.json').read_text())
          expected = {entry['path']: entry['sha256'] for entry in manifest['files']}
          actual = {}
          for file in root.rglob('*'):
              if not file.is_file():
                  continue
              rel = file.relative_to(root).as_posix()
              if rel == '_bonumark_stream/RELEASE-MANIFEST.json':
                  continue
              actual[rel] = hashlib.sha256(file.read_bytes()).hexdigest()
          missing = sorted(set(expected) - set(actual))
          extra = sorted(set(actual) - set(expected))
          mismatch = sorted(path for path in expected.keys() & actual.keys() if expected[path] != actual[path])
          if missing or extra or mismatch:
              raise SystemExit(f'manifest verification failed: missing={missing} extra={extra} mismatch={mismatch}')
          print(f'manifest verified: {len(expected)} files')
          PY
          )

      - name: Commit finalized v0.7.2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Bonumark Stream v0.7.2"
          git push origin HEAD:release/v0.7.2
