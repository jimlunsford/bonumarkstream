# Trigger the one-time v0.7.2 release-branch finalizer now.
name: Finalize v0.7.2 branch

on:
  push:
    branches: [release/v0.7.2]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: release/v0.7.2
          fetch-depth: 0

      - name: Apply exact v0.7.2 candidate patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/v071-v072.patch.xz.b64 | xz -dc > "$RUNNER_TEMP/v071-v072.patch"
          git apply --check "$RUNNER_TEMP/v071-v072.patch"
          git apply "$RUNNER_TEMP/v071-v072.patch"

      - name: Verify finalized release tree
        shell: bash
        run: |
          set -euo pipefail
          release_tree="$RUNNER_TEMP/bonumark-v072"
          rm -rf "$release_tree"
          mkdir -p "$release_tree"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/finalize-v072.yml' \
            --exclude='.github/v071-v072.patch.xz.b64' \
            ./ "$release_tree/"
          cd "$release_tree"
          test "$(cat VERSION)" = "0.7.2"
          test -f scripts/fixtures/v0.4.x-initial-schema.php
          php scripts/smoke-test.php
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find . -type f -name '*.php' -print0)

      - name: Commit finalized v0.7.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-v072.yml
          rm .github/v071-v072.patch.xz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Bonumark Stream v0.7.2"
          git push origin HEAD:release/v0.7.2
