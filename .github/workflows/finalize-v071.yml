# Trigger the one-time release-branch finalizer now.
name: Finalize v0.7.1 branch

on:
  push:
    branches: [release/v0.7.1]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: release/v0.7.1
          fetch-depth: 0

      - name: Apply v0.7.1 release corrections
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')

          def replace(path, old, new, count=None):
              p = root / path
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              text = text.replace(old, new, count if count is not None else -1)
              p.write_text(text)

          replace('_bonumark_stream/app/functions.php', "'version' => '0.7.0'", "'version' => '0.7.1'", 1)
          replace('docs/API.md', '"version": "0.7.0"', '"version": "0.7.1"')
          replace('docs/INSTALL.md', 'Bonumark Stream v0.7.0 is the current release package.', 'Bonumark Stream v0.7.1 is the current release package.', 1)
          replace('docs/REMOTE-POSTING.md', '## Current status in v0.7.0', '## Current status in v0.7.1', 1)
          replace('docs/REMOTE-POSTING.md', '"version": "0.7.0"', '"version": "0.7.1"')
          replace('docs/openapi/bonumark-stream-api.json', '"version": "0.7.0"', '"version": "0.7.1"', 1)

          p = root / 'docs/UPGRADING.md'
          t = p.read_text()
          t = t.replace('Bonumark Stream v0.7.0 continues the maintained v0.4.0+ upgrade line and supports both managed application trees and intentionally locked-down deployments.', 'Bonumark Stream v0.7.1 continues the maintained v0.4.0+ upgrade line and supports both managed application trees and intentionally locked-down deployments.', 1)
          t = t.replace('/path/to/bonumark-stream-v0.7.0.zip', '/path/to/bonumark-stream-v0.7.1.zip')
          t = t.replace('To move a locked-down v0.6.0 installation to v0.7.0 without performing a full manual overlay first, extract the v0.7.0 release outside the live site', 'To move a locked-down v0.6.0 installation to v0.7.1 without performing a full manual overlay first, extract the v0.7.1 release outside the live site', 1)
          marker = '''## v0.7.0 - Hosting Portability & Upgrade Workflow

          v0.7.0 is the next intended public release after v0.6.0. It consolidates the hosting portability, upgrade, deployment verification, compatibility, and diagnostic work completed in the v0.6.1 through v0.6.8 development builds.'''
          insert = '''## v0.7.1 - Compatibility Workflow Correction Pass

          v0.7.1 supersedes the unreleased v0.7.0 candidate as the intended public release after v0.6.0. The runtime product behavior is unchanged from that candidate. The correction is limited to repository/package verification: the compatibility matrix now tests a clean tracked source snapshot, and the Remote Stream Posts API route is present in the GitHub source tree as required by the release manifest and API contract.

          ### Database changes from v0.6.0

          v0.7.1 adds **no new database migration compared with v0.6.0**. The migration directory still ends at `0017_profile_photos.php`. Installations older than v0.6.0 may still have earlier pending migrations when moving directly to v0.7.1.

          ### Upgrade guidance

          Use the same Admin ZIP or owner-run CLI upgrade path described above. Back up the database and site files before a production upgrade, confirm the ZIP is the expected v0.7.1 package, review Admin → System Check, and verify the public site plus owner data after the upgrade.

          ## v0.7.0 - Hosting Portability & Upgrade Workflow

          v0.7.0 was the unreleased release candidate that consolidated the hosting portability, upgrade, deployment verification, compatibility, and diagnostic work completed in the v0.6.1 through v0.6.8 development builds.'''
          marker = marker.replace('\n          ', '\n')
          insert = insert.replace('\n          ', '\n')
          if marker not in t:
              raise SystemExit('UPGRADING marker missing')
          p.write_text(t.replace(marker, insert, 1))

          p = root / '_bonumark_stream/CHANGELOG.md'
          t = p.read_text()
          if not t.startswith('## 0.7.0 - Hosting Portability & Upgrade Workflow'):
              raise SystemExit('private changelog does not start with expected v0.7.0 entry')
          entry = '''## 0.7.1 - Compatibility Workflow Correction Pass

          - Supersedes the unreleased v0.7.0 release candidate without changing the product milestone or runtime feature set.
          - Updates `.github/workflows/compatibility.yml` to use the Node 24 based `actions/checkout@v5`, create a clean tracked source snapshot with `git archive HEAD`, and run PHP lint, the package smoke test, migration/schema smoke test, and Remote Posting API database smoke test from that snapshot.
          - Prevents Git checkout metadata under `.git/` from being misclassified as unexpected package files by the release-manifest smoke checks.
          - Ensures `api/v1/stream/posts.php` is present in repository source, matching the v0.7.0 release package, release manifest, Remote Posting documentation, and smoke-test contract.
          - Updates current-version documentation and package metadata to v0.7.1.
          - Keeps the compatibility floors, application runtime behavior, upgrade behavior, owner-data preservation contract, and migration set unchanged.
          - Adds no database migration.

          '''.replace('\n          ', '\n')
          p.write_text(entry + t)

          manifest_path = root / '_bonumark_stream/RELEASE-MANIFEST.json'
          files = []
          for file in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x: x.relative_to(root).as_posix()):
              rel = file.relative_to(root).as_posix()
              if rel == '_bonumark_stream/RELEASE-MANIFEST.json' or rel.startswith('.git/') or rel == '.github/workflows/finalize-v071.yml':
                  continue
              files.append({'path': rel, 'sha256': hashlib.sha256(file.read_bytes()).hexdigest()})
          manifest = {
              'name': 'bonumark-stream',
              'version': '0.7.1',
              'generated_at': '2026-08-26T17:03:54Z',
              'files': files,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Verify corrected release source
        shell: bash
        run: |
          set -euo pipefail
          release_tree="$RUNNER_TEMP/bonumark-v071"
          rm -rf "$release_tree"
          mkdir -p "$release_tree"
          rsync -a --exclude='.git/' --exclude='.github/workflows/finalize-v071.yml' ./ "$release_tree/"
          (
            cd "$release_tree"
            php scripts/smoke-test.php
            test "$(cat VERSION)" = "0.7.1"
            test -f api/v1/stream/posts.php
          )

      - name: Commit finalized v0.7.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-v071.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Bonumark Stream v0.7.1"
          git push origin HEAD:release/v0.7.1
