name: Connect Service

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    name: Node 24 / ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: 'mysql:8.0'
            label: 'MySQL 8.0'
          - database: 'mariadb:10.6'
            label: 'MariaDB 10.6'
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: connect_fixture_password
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: connect_fixture_password
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pconnect_fixture_password || mariadb-admin ping -h 127.0.0.1 -uroot -pconnect_fixture_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: services/bonumark-connect
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: services/bonumark-connect/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, curl, fileinfo, zip, gd, mbstring, intl
          coverage: none
      - name: Install exact dependencies and verify source
        run: |
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Unit, encryption, SSRF and real TLS tests
        run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Provision disposable databases
        env:
          MYSQL_PWD: connect_fixture_password
        run: mysql -h127.0.0.1 -uroot -e 'CREATE DATABASE bonumark_ci; CREATE DATABASE bmc_test;'
      - name: Real site, relay and database authorization tests
        env:
          BMS_DB_HOST: 127.0.0.1
          BMS_DB_NAME: bonumark_ci
          BMS_DB_USER: root
          BMS_DB_PASS: connect_fixture_password
          BMS_DB_DANGER_RESET: '1'
          BMC_TEST_DB_USER: root
          BMC_TEST_DB_PASSWORD: connect_fixture_password
          BMC_BROWSER_TEST: '1'
        run: npm run test:database
      - name: Verify clean service package
        env:
          BMC_PACKAGE_PATH: ${{ runner.temp }}/bonumark-connect-source.tar.gz
        run: npm run package
      - name: Check tracked source for credential material
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess,hashlib
          root=pathlib.Path('../..').resolve()
          names=subprocess.check_output(['git','ls-files','-z'],cwd=root).decode().split('\0')
          pattern=re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|\bbmsc_[a-f0-9]{64}\b|\bbmca_[a-f0-9]{64}\b')
          for name in filter(None,names):
              data=(root/name).read_bytes()
              # Existing public ActivityPub test key, pinned to accepted baseline bytes.
              if name=='scripts/activitypub-foundation-test.php' and hashlib.sha256(data).hexdigest()=='fba42e492b0224975dfab8409a1172600446f92f61aee0a83a1f25708655f8d7':
                  continue
              if pattern.search(data):
                  raise SystemExit('Potential committed secret: '+name)
          print('No committed Connect credentials or private keys found.')
          PY
