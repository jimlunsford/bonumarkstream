# Bonumark Stream Nginx server example
#
# Copy the relevant directives into the server {} block for the Bonumark site.
# Replace example.com, the document root, and the PHP-FPM socket/path for the host.
# TLS/certificate configuration is intentionally omitted because it is host-specific.

server {
    listen 80;
    server_name example.com;
    root /var/www/example.com;
    index index.php index.html;

    # Match this to the intended Bonumark/PHP upload policy. The default
    # Bonumark media limit is 32 MB; multipart overhead means the HTTP request
    # limit should be somewhat higher than the file limit.
    client_max_body_size 40m;

    # Private application storage and shipped CLI tools must never be public.
    location ^~ /_bonumark_stream/ {
        return 403;
    }

    location ^~ /scripts/ {
        return 403;
    }

    # Block dotfiles while allowing ACME challenge paths when used by the host.
    location ~ /\.(?!well-known(?:/|$)) {
        return 403;
    }

    # Bonumark clean routes. Existing query parameters are preserved by Nginx.
    rewrite ^/\.well-known/webfinger/?$ /index.php?__bonumark_route=activitypub_webfinger last;
    rewrite ^/activitypub/actor/?$ /index.php?__bonumark_route=activitypub_actor last;
    rewrite ^/activitypub/inbox/?$ /index.php?__bonumark_route=activitypub_inbox last;
    rewrite ^/activitypub/outbox/?$ /index.php?__bonumark_route=activitypub_outbox last;
    rewrite ^/activitypub/followers/?$ /index.php?__bonumark_route=activitypub_followers last;
    rewrite ^/activitypub/following/?$ /index.php?__bonumark_route=activitypub_following last;
    rewrite ^/activitypub/objects/([1-9][0-9]*)/?$ /index.php?__bonumark_route=activitypub_object&post_id=$1 last;
    rewrite ^/activitypub/activities/create/([1-9][0-9]*)/?$ /index.php?__bonumark_route=activitypub_create_activity&post_id=$1 last;

    rewrite ^/api/v1/status/?$ /index.php?__bonumark_route=api_status last;
    rewrite ^/api/v1/cron/?$ /index.php?__bonumark_route=web_cron last;
    rewrite ^/api/v1/stream/posts/?$ /index.php?__bonumark_route=api_stream_posts last;
    rewrite ^/api/v1/media/import/?$ /index.php?__bonumark_route=api_media_import last;
    rewrite ^/api/v1/media/?$ /index.php?__bonumark_route=api_media last;

    rewrite ^/profile\.php$ /index.php?__bonumark_route=profile last;
    rewrite ^/profile/?$ /index.php?__bonumark_route=profile last;
    rewrite ^/profile/([A-Za-z0-9._-]+)/?$ /index.php?__bonumark_route=profile&user=$1 last;
    rewrite ^/account\.php$ /index.php?__bonumark_route=account last;
    rewrite ^/account/?$ /index.php?__bonumark_route=account last;
    rewrite ^/page\.php$ /index.php?__bonumark_route=page last;

    rewrite ^/feed\.xml$ /index.php?__bonumark_route=feed&feed_type=root last;
    rewrite ^/stream/feed\.xml$ /index.php?__bonumark_route=feed&feed_type=stream last;
    rewrite ^/sitemap\.xml$ /index.php?__bonumark_route=sitemap last;
    rewrite ^/sitemap\.xsl$ /index.php?__bonumark_route=sitemap_xsl last;
    rewrite ^/robots\.txt$ /index.php?__bonumark_route=robots last;

    rewrite ^/stream/?$ /index.php?__bonumark_route=stream last;
    rewrite ^/stream/page/?$ /index.php?__bonumark_route=stream&stream_page=1 last;
    rewrite ^/stream/page/([0-9]+)/?$ /index.php?__bonumark_route=stream&stream_page=$1 last;
    rewrite ^/stream/([A-Za-z0-9._-]+)/?$ /index.php?__bonumark_route=stream&slug=$1 last;
    rewrite ^/pages/([A-Za-z0-9._-]+)/?$ /index.php?__bonumark_route=page&slug=$1 last;
    rewrite ^/comments\.php$ /index.php?__bonumark_route=comments last;
    rewrite ^/search\.php$ /index.php?__bonumark_route=search last;
    rewrite ^/search/?$ /index.php?__bonumark_route=search last;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Never execute PHP from public media storage, even if a bad file appears there.
    location ~ ^/media/.*\.php(?:/|$) {
        return 403;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        # CHANGE THIS to the PHP-FPM listener used by the host.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Optional cache policy matching the intent of the bundled Apache rules.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|svg|ico|avif|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:pdf|txt|doc|docx)$ {
        expires 30d;
        try_files $uri =404;
    }
}
